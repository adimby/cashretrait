name: Update tariffs
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update-tariffs
      - name: Read report
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const report = JSON.parse(fs.readFileSync('update-report.json', 'utf8'))
            core.setOutput('ok', String(report.some((o) => o.status === 'ok')))
            core.setOutput('suspect', String(report.some((o) => o.status === 'suspect')))
      - name: Test and commit automatic changes to main
        id: main
        if: ${{ steps.report.outputs.ok == 'true' && github.ref == 'refs/heads/main' }}
        run: |
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tarifs.json
          git commit -m "chore(tarifs): mise à jour automatique"
          git pull --rebase origin main || { sleep 5; git rebase --abort || true; git pull --rebase origin main; }
          git push origin HEAD:main || { sleep 5; git pull --rebase origin main && git push origin HEAD:main; }
      - name: Choose review branch
        id: pick
        if: ${{ !cancelled() && steps.report.outputs.suspect == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 })
            const existing = open.find((p) => p.head.ref.startsWith('tarifs/auto-') && p.head.repo.full_name === `${owner}/${repo}`)
            const d = new Date().toISOString().slice(0, 10).replace(/-/g, '')
            core.setOutput('name', existing ? existing.head.ref : `tarifs/auto-${d}`)
      - name: Push suspect changes to a review branch
        id: branch
        if: ${{ !cancelled() && steps.report.outputs.suspect == 'true' && steps.pick.outcome == 'success' }}
        env:
          BRANCH: ${{ steps.pick.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          cp update-suspect.json public/tarifs.json
          git add public/tarifs.json
          git commit -m "chore(tarifs): mise à jour à vérifier"
          git push --force origin "$BRANCH"
      - name: Open pull request and issues
        id: notify
        if: ${{ always() && steps.report.conclusion == 'success' }}
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.branch.outcome == 'success' && steps.pick.outputs.name || '' }}
          MAIN_FAILED: ${{ steps.main.outcome == 'failure' && 'true' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const report = JSON.parse(fs.readFileSync('update-report.json', 'utf8'))
            let failed = false
            // Issues first, so a PR failure never hides them.
            const failures = report.filter((x) => x.status === 'failed')
            const wanted = failures.map((o) => ({
              title: `Mise à jour tarifs échouée : ${o.operator}`,
              body: o.reasons.map((r) => `- ${r}`).join('\n') || 'Échec sans détail.',
            }))
            if (process.env.MAIN_FAILED === 'true') {
              wanted.push({
                title: 'Mise à jour tarifs : échec du commit',
                body: `Les tests (sur l’instantané figé) ou le commit/push vers main ont échoué : ${process.env.RUN_URL}`,
                update: true,
              })
            }
            if (wanted.length) {
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 })
              for (const w of wanted) {
                const existing = issues.find((i) => !i.pull_request && i.title === w.title)
                if (existing && !w.update) continue
                try {
                  // Deduplicate by title: the commit-failure Issue gets a comment per failed run instead of a duplicate.
                  if (existing) await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: w.body })
                  else await github.rest.issues.create({ owner, repo, title: w.title, body: w.body })
                } catch (e) {
                  core.error(`Issue: ${e.message}`)
                  failed = true
                }
              }
            }
            const branch = process.env.BRANCH
            if (branch) {
              try {
                const body = fs.readFileSync('update-summary.md', 'utf8')
                const open = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}` })
                if (open.data.length === 0) {
                  await github.rest.pulls.create({ owner, repo, head: branch, base: 'main', title: 'Mise à jour des tarifs à vérifier', body })
                } else {
                  await github.rest.pulls.update({ owner, repo, pull_number: open.data[0].number, body })
                }
              } catch (e) {
                core.error(`PR: ${e.message}`)
                failed = true
              }
            }
            if (failed) core.setFailed('PR or Issue creation failed')
      - name: Fail job if a previous step failed
        if: ${{ always() && (steps.report.outcome == 'failure' || steps.main.outcome == 'failure' || steps.pick.outcome == 'failure' || steps.branch.outcome == 'failure' || steps.notify.outcome == 'failure') }}
        run: exit 1
