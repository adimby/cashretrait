name: Update tariffs
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run update-tariffs
      - name: Read report
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const report = JSON.parse(fs.readFileSync('update-report.json', 'utf8'))
            core.setOutput('ok', String(report.some((o) => o.status === 'ok')))
            core.setOutput('suspect', String(report.some((o) => o.status === 'suspect')))
      - name: Test and commit automatic changes to main
        if: steps.report.outputs.ok == 'true'
        run: |
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tarifs.json
          git commit -m "chore(tarifs): mise à jour automatique"
          git push origin HEAD:main
      - name: Push suspect changes to a review branch
        id: branch
        if: steps.report.outputs.suspect == 'true'
        run: |
          BRANCH="tarifs/auto-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          cp update-suspect.json public/tarifs.json
          git add public/tarifs.json
          git commit -m "chore(tarifs): mise à jour à vérifier"
          git push --force origin "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Open pull request and issues
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const report = JSON.parse(fs.readFileSync('update-report.json', 'utf8'))
            const branch = process.env.BRANCH
            if (branch) {
              const open = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}` })
              const body = fs.readFileSync('update-summary.md', 'utf8')
              if (open.data.length === 0) {
                await github.rest.pulls.create({ owner, repo, head: branch, base: 'main', title: 'Mise à jour des tarifs à vérifier', body })
              } else {
                await github.rest.pulls.update({ owner, repo, pull_number: open.data[0].number, body })
              }
            }
            for (const o of report.filter((x) => x.status === 'failed')) {
              const title = `Mise à jour tarifs échouée : ${o.operator}`
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 })
              if (issues.some((i) => !i.pull_request && i.title === title)) continue
              await github.rest.issues.create({ owner, repo, title, body: o.reasons.map((r) => `- ${r}`).join('\n') || 'Échec sans détail.' })
            }
